# dsh-session-admin bundle patch
#
# The `dsh.bundle.patch` layer of the published npm package. When the plugin
# is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-session-admin@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-session-admin` to the bundle
# stack. The profile boot then merges THIS patch (a single additive `insert`
# of the plugin row). The row is appended AFTER every stock web row, so all
# services this plugin reads (webServer, workspaceRegistry, sessions,
# sessionQuery, sessionPersistence) already exist when it activates.
#
# Deliberately NO stock rows are restated here: an additive plugin that
# overrides nothing cannot conflict with other plugins or with future
# harness upgrades.
- insert:
    - id: session-manager
      name: 'dsh-session-admin'
